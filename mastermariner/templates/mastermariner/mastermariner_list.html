{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Master Mariner Management</h2>
    <a href="{% url 'mastermariners:create' %}" class="btn btn-primary mb-3">
        <i class="fas fa-plus"></i> Add New Master Mariner
    </a>

    <!-- Search and Filter Form -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="get" class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="q" class="form-control" placeholder="Search mastermariners..." 
                           value="{{ request.GET.q }}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-filter"></i> Filter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Name</th>
                <th>Designation</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for mastermariner in object_list %}
            <tr>
                <td>{{ mastermariner.name }}</td>
                <td>{{ mastermariner.designation }}</td>
                <td>
                    <a href="{% url 'mastermariners:detail' mastermariner.pk %}" class="btn btn-sm btn-info">
                        <i class="fas fa-eye"></i>
                    </a>
                    <a href="{% url 'mastermariners:update' mastermariner.pk %}" class="btn btn-sm btn-warning">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{% url 'mastermariners:delete' mastermariner.pk %}" class="btn btn-sm btn-danger">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No master mariner found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
